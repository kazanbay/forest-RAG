[project]
name = "forest"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.13.0",
    "markdownify>=1.1.0",
    "playwright>=1.63.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "qdrant-client[fastembed]>=1.19.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.1",
    "transformers>=5.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
